name: Build WhisperBoard IPA

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || echo "用系统默认Xcode"

      - name: Install mise
        run: |
          curl https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tuist
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise install tuist swiftlint swiftformat

      - name: Generate secrets
        run: |
          chmod +x ./ci_scripts/secrets.sh
          ./ci_scripts/secrets.sh || echo "secrets 用占位值"

      - name: Tuist generate project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise x tuist -- tuist install
          mise x tuist -- tuist generate --no-open

      - name: Build .app (no signing)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          xcodebuild \
            -workspace WhisperBoard.xcworkspace \
            -scheme WhisperBoard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build

      - name: Package .ipa
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WhisperBoard.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhisperBoard-ipa
          path: WhisperBoard.ipa
